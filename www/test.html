<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test - Network Simulator</title>
    <style>
        #log {
            background: #f0f0f0;
            padding: 10px;
            margin: 10px;
            height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .error { color: red; }
        .success { color: green; }
        button { margin: 5px; padding: 10px; }
    </style>
</head>
<body>
    <h1>Network Simulator Test</h1>
    
    <div>
        <button id="test-basic">Test Basic JavaScript</button>
        <button id="test-wasm">Test WebAssembly</button>
        <button id="test-full">Test Full Application</button>
    </div>
    
    <div id="log"></div>
    
    <script type="module">
        const log = document.getElementById('log');
        
        function addLog(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = type;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }
        
        // Override console methods to capture errors
        const originalError = console.error;
        console.error = function(...args) {
            addLog('Console Error: ' + args.join(' '), 'error');
            originalError.apply(console, args);
        };
        
        // Test basic JavaScript
        document.getElementById('test-basic').addEventListener('click', () => {
            try {
                addLog('Testing basic JavaScript...');
                
                // Test DOM elements
                const elements = [
                    'add-router-btn',
                    'connect-routers-btn',
                    'delete-router-btn',
                    'disconnect-routers-btn',
                    'simulate-btn'
                ];
                
                let allFound = true;
                for (const id of elements) {
                    const el = document.getElementById(id);
                    if (el) {
                        addLog(`✓ Found element: ${id}`, 'success');
                    } else {
                        addLog(`✗ Missing element: ${id}`, 'error');
                        allFound = false;
                    }
                }
                
                if (allFound) {
                    addLog('All button elements found!', 'success');
                }
                
            } catch (err) {
                addLog(`Error: ${err.message}`, 'error');
            }
        });
        
        // Test WebAssembly
        document.getElementById('test-wasm').addEventListener('click', async () => {
            try {
                addLog('Testing WebAssembly...');
                
                // Check WebAssembly support
                if (typeof WebAssembly === 'undefined') {
                    throw new Error('WebAssembly is not supported in this browser');
                }
                addLog('✓ WebAssembly is supported', 'success');
                
                // Try to load the module
                addLog('Loading WASM module...');
                const module = await import('./pkg/nw_simulator.js');
                addLog('✓ Module loaded', 'success');
                
                // Try to initialize
                addLog('Initializing WASM...');
                await module.default();
                addLog('✓ WASM initialized', 'success');
                
                // Try to create simulator
                addLog('Creating NetworkSimulator...');
                const simulator = new module.NetworkSimulator();
                addLog('✓ NetworkSimulator created', 'success');
                
                // Test a method
                const routerId = simulator.add_router('TestRouter', 100, 100);
                addLog(`✓ Router added with ID: ${routerId}`, 'success');
                
            } catch (err) {
                addLog(`Error: ${err.message}`, 'error');
                console.error(err);
            }
        });
        
        // Test full application
        document.getElementById('test-full').addEventListener('click', async () => {
            try {
                addLog('Testing full application...');
                
                // Load all modules
                addLog('Loading modules...');
                const wasmModule = await import('./pkg/nw_simulator.js');
                const { PacketVisualizer } = await import('./packet-visualizer.js');
                
                addLog('✓ All modules loaded', 'success');
                
                // Initialize
                addLog('Initializing...');
                await wasmModule.default();
                const simulator = new wasmModule.NetworkSimulator();
                
                addLog('✓ Application initialized successfully!', 'success');
                addLog('The application should work correctly.', 'success');
                
            } catch (err) {
                addLog(`Error: ${err.message}`, 'error');
                console.error(err);
            }
        });
        
        // Initial log
        addLog('Test page loaded. Click a button to start testing.');
    </script>
</body>
</html>
