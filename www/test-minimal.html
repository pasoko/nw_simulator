<!DOCTYPE html>
<html>
<head>
    <title>Minimal OSPF Test</title>
</head>
<body>
    <h1>Minimal OSPF Test</h1>
    <p>Check browser console for output (F12)</p>
    <pre id="log" style="background: #f0f0f0; padding: 10px;"></pre>
    
    <script type="module">
        const logEl = document.getElementById('log');
        
        function log(msg) {
            console.log(msg);
            logEl.textContent += msg + '\n';
        }
        
        log('Loading WASM module...');
        
        import('./pkg/nw_simulator.js').then(async (module) => {
            log('Module loaded, initializing...');
            
            await module.default();
            log('WASM initialized');
            
            const sim = new module.NetworkSimulator();
            log('Simulator created');
            
            // Create 2 routers
            const r1 = sim.add_router("R1", 100, 100);
            const r2 = sim.add_router("R2", 300, 100);
            log(`Routers created: R1=${r1}, R2=${r2}`);
            
            // Connect them
            sim.connect_routers(r1, r2, 10);
            log('Routers connected');
            
            // Enable OSPF
            sim.enable_ospf(r1);
            sim.enable_ospf(r2);
            log('OSPF enabled');
            
            // Start simulation
            sim.start_simulation();
            log('Simulation started');
            
            // Run for 3 seconds
            let count = 0;
            const interval = setInterval(() => {
                sim.step_simulation(0.1);
                count++;
                
                if (count % 10 === 0) {
                    log(`\nTime: ${(count * 0.1).toFixed(1)}s`);
                    
                    // Check router 1
                    const r1_json = sim.get_router_summary_json(r1);
                    const r1_summary = JSON.parse(r1_json);
                    log(`R1: Neighbors=${r1_summary.neighbor_count}, LSAs=${r1_summary.lsa_count}, Routes=${r1_summary.routing_table ? r1_summary.routing_table.length : 0}`);
                    
                    // Check router 2  
                    const r2_json = sim.get_router_summary_json(r2);
                    const r2_summary = JSON.parse(r2_json);
                    log(`R2: Neighbors=${r2_summary.neighbor_count}, LSAs=${r2_summary.lsa_count}, Routes=${r2_summary.routing_table ? r2_summary.routing_table.length : 0}`);
                }
                
                if (count >= 30) {
                    clearInterval(interval);
                    log('\nTest complete');
                }
            }, 100);
            
        }).catch(err => {
            log('Error: ' + err.message);
            console.error(err);
        });
    </script>
</body>
</html>
