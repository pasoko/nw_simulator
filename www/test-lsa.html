<!DOCTYPE html>
<html>
<head>
    <title>OSPF LSA Database Test</title>
    <script type="module">
        import('./nw_simulator.wasm')
            .then(wasmModule => {
                console.log('WASM module loaded successfully');
                
                // Initialize simulator
                const simulator = new wasmModule.NetworkSimulator();
                
                // Create 2 routers for simple test
                console.log('Creating 2-router topology...');
                const r1 = simulator.add_router("Router1", 100, 100);
                const r2 = simulator.add_router("Router2", 300, 100);
                
                // Connect routers
                console.log('Connecting routers...');
                simulator.connect_routers(r1, r2, 10);
                
                // Enable OSPF on both routers
                console.log('Enabling OSPF...');
                simulator.enable_ospf(r1);
                simulator.enable_ospf(r2);
                
                // Start simulation
                console.log('Starting simulation...');
                simulator.start_simulation();
                
                // Run simulation for 60 seconds
                let simTime = 0;
                const interval = setInterval(() => {
                    simulator.step_simulation(1.0);
                    simTime += 1;
                    
                    // Check state every 5 seconds
                    if (simTime % 5 === 0) {
                        console.log(`\n=== Time: ${simTime}s ===`);
                        
                        // Get detailed info for both routers
                        for (let id of [r1, r2]) {
                            const summary = JSON.parse(simulator.get_router_summary_json(id));
                            console.log(`Router ${id}:`);
                            console.log(`  OSPF Enabled: ${summary.ospf_enabled}`);
                            console.log(`  Neighbors: ${summary.neighbor_count}`);
                            console.log(`  LSA Database Size: ${summary.lsa_count}`);
                            console.log(`  Routing Table Entries: ${summary.routing_table ? summary.routing_table.length : 0}`);
                            
                            // Show neighbor states
                            if (summary.neighbors) {
                                summary.neighbors.forEach(neighbor => {
                                    console.log(`  Neighbor ${neighbor.router_id}: ${neighbor.state}`);
                                });
                            }
                            
                            // Show routing table
                            if (summary.routing_table && summary.routing_table.length > 0) {
                                console.log('  Routing Table:');
                                summary.routing_table.forEach(route => {
                                    console.log(`    ${route.destination}/${route.netmask} -> ${route.next_hop} (metric: ${route.metric})`);
                                });
                            }
                        }
                    }
                    
                    // Stop after 60 seconds
                    if (simTime >= 60) {
                        clearInterval(interval);
                        console.log('\nTest complete.');
                        
                        // Final check
                        console.log('\n=== FINAL STATE ===');
                        for (let id of [r1, r2]) {
                            const summary = JSON.parse(simulator.get_router_summary_json(id));
                            console.log(`Router ${id}: LSAs=${summary.lsa_count}, Routes=${summary.routing_table ? summary.routing_table.length : 0}`);
                        }
                    }
                }, 100); // Run every 100ms
            })
            .catch(error => {
                console.error('Failed to load WASM module:', error);
            });
    </script>
</head>
<body>
    <h1>OSPF LSA Database Test</h1>
    <p>Open the browser console (F12) to see the test results.</p>
    <p>This test creates a simple 2-router topology and monitors LSA database and routing table updates.</p>
    <p>The simulation runs for 60 seconds.</p>
</body>
</html>
