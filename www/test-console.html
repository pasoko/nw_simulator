<!DOCTYPE html>
<html>
<head>
    <title>Console Log Test</title>
    <style>
        #output {
            font-family: monospace;
            white-space: pre-wrap;
            background: #f0f0f0;
            padding: 10px;
            margin: 20px;
            border: 1px solid #ccc;
            height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>OSPF Console Output Test</h1>
    <div id="output">Loading...</div>
    
    <script type="module">
        const output = document.getElementById('output');
        
        // Override console.log to display on page
        const originalLog = console.log;
        console.log = function(...args) {
            const message = args.join(' ');
            output.textContent += message + '\n';
            output.scrollTop = output.scrollHeight;
            originalLog.apply(console, args);
        };
        
        import init, { NetworkSimulator } from './pkg/nw_simulator.js';
        
        async function runTest() {
            try {
                output.textContent = 'Initializing WASM...\n';
                await init();
                console.log('WASM module initialized');
                
                const sim = new NetworkSimulator();
                console.log('NetworkSimulator created');
                
                // Create simple 2 routers
                const r1 = sim.add_router("R1", 100, 100);
                const r2 = sim.add_router("R2", 300, 100);
                console.log(`Created routers: R1=${r1}, R2=${r2}`);
                
                // Connect them
                sim.connect_routers(r1, r2, 10);
                console.log('Routers connected with cost 10');
                
                // Enable OSPF
                sim.enable_ospf(r1);
                sim.enable_ospf(r2);
                console.log('OSPF enabled on both routers');
                
                // Start simulation
                sim.start_simulation();
                console.log('Simulation started\n');
                
                // Step simulation for 10 seconds
                for (let i = 0; i < 100; i++) {
                    sim.step_simulation(0.1);
                    
                    // Every second, check status
                    if (i % 10 === 0) {
                        const time = i * 0.1;
                        console.log(`\n=== Time: ${time.toFixed(1)}s ===`);
                        
                        // Check each router
                        for (let id of [r1, r2]) {
                            try {
                                const json = sim.get_router_summary_json(id);
                                const summary = JSON.parse(json);
                                
                                console.log(`Router ${id}:`);
                                console.log(`  OSPF: ${summary.ospf_enabled}`);
                                console.log(`  Neighbors: ${summary.neighbor_count}`);
                                console.log(`  LSAs: ${summary.lsa_count}`);
                                console.log(`  Routes: ${summary.routing_table ? summary.routing_table.length : 0}`);
                                
                                if (summary.routing_table && summary.routing_table.length > 0) {
                                    console.log('  Routing table:');
                                    summary.routing_table.forEach(route => {
                                        console.log(`    ${route.destination} -> ${route.next_hop} (metric ${route.metric})`);
                                    });
                                }
                            } catch (e) {
                                console.log(`  Error: ${e.message}`);
                            }
                        }
                    }
                }
                
                console.log('\n=== Test Complete ===');
                
                // Get final events
                try {
                    const eventsJson = sim.get_recent_events_json(50);
                    const events = JSON.parse(eventsJson);
                    
                    console.log('\nRecent events:');
                    events.slice(-10).forEach(event => {
                        console.log(`[${event.timestamp.toFixed(2)}s] ${event.description}`);
                    });
                } catch (e) {
                    console.log(`Error getting events: ${e.message}`);
                }
                
            } catch (error) {
                console.log(`Error: ${error.message}`);
                console.log(`Stack: ${error.stack}`);
            }
        }
        
        runTest();
    </script>
</body>
</html>
