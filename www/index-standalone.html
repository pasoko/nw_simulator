<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Simulator - Standalone</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        #sidebar {
            width: 300px;
            background-color: #f0f0f0;
            padding: 20px;
            overflow-y: auto;
        }
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #network-canvas {
            border: 1px solid #ccc;
            cursor: crosshair;
        }
        .button {
            padding: 8px 16px;
            margin: 5px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #45a049;
        }
        .button.secondary {
            background-color: #008CBA;
        }
        .button.secondary:hover {
            background-color: #007399;
        }
        .button.danger {
            background-color: #dc3545;
        }
        .button.danger:hover {
            background-color: #c82333;
        }
        #log-container {
            height: 200px;
            background-color: #2b2b2b;
            color: #00ff00;
            padding: 10px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 12px;
        }
        .mode-indicator {
            padding: 5px 10px;
            margin: 10px 0;
            background-color: #ffc107;
            color: #000;
            border-radius: 4px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <h2>Network Simulator</h2>
        <div class="mode-indicator" id="mode-indicator">Mode: Add Router</div>
        
        <h3>Controls</h3>
        <button class="button" id="add-router-btn">Add Router</button>
        <button class="button secondary" id="connect-routers-btn">Connect Routers</button>
        <button class="button danger" id="delete-router-btn">Delete Router</button>
        <button class="button danger" id="disconnect-routers-btn">Disconnect Routers</button>
        <button class="button secondary" id="simulate-btn">Start Simulation</button>
        
        <h3>Routers</h3>
        <div id="routers-list"></div>
    </div>
    
    <div id="main">
        <div id="canvas-container">
            <canvas id="network-canvas"></canvas>
        </div>
        <div id="log-container">
            <div id="log-content"></div>
        </div>
    </div>
    
    <script type="module">
        // Debug log
        const logContent = document.getElementById('log-content');
        function log(message) {
            const entry = document.createElement('div');
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }
        
        log('Starting application...');
        
        // Test buttons first
        document.getElementById('add-router-btn').addEventListener('click', () => {
            log('Add Router button clicked!');
            alert('Add Router clicked!');
        });
        
        document.getElementById('connect-routers-btn').addEventListener('click', () => {
            log('Connect Routers button clicked!');
            alert('Connect Routers clicked!');
        });
        
        document.getElementById('delete-router-btn').addEventListener('click', () => {
            log('Delete Router button clicked!');
            alert('Delete Router clicked!');
        });
        
        document.getElementById('disconnect-routers-btn').addEventListener('click', () => {
            log('Disconnect Routers button clicked!');
            alert('Disconnect Routers clicked!');
        });
        
        document.getElementById('simulate-btn').addEventListener('click', () => {
            log('Simulate button clicked!');
            alert('Simulate clicked!');
        });
        
        log('Button handlers attached');
        
        // Try to load WASM
        try {
            log('Loading WASM module...');
            const wasmModule = await import('./pkg/nw_simulator.js');
            log('WASM module loaded');
            
            await wasmModule.default();
            log('WASM initialized');
            
            const simulator = new wasmModule.NetworkSimulator();
            log('NetworkSimulator created');
            
            // Make simulator global for testing
            window.simulator = simulator;
            log('Simulator ready! Available as window.simulator');
            
        } catch (err) {
            log(`Error: ${err.message}`);
            console.error(err);
        }
    </script>
</body>
</html>
