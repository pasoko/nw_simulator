<!DOCTYPE html>
<html>
<head>
    <title>OSPF Debug Test</title>
    <script type="module">
        import('./nw_simulator.wasm')
            .then(wasmModule => {
                console.log('WASM module loaded successfully');
                
                // Initialize simulator
                const simulator = new wasmModule.NetworkSimulator();
                
                // Create 2 routers for simple test
                console.log('Creating 2-router topology...');
                const r1 = simulator.add_router("Router1", 100, 100);
                const r2 = simulator.add_router("Router2", 300, 100);
                
                console.log(`Router 1 ID: ${r1}`);
                console.log(`Router 2 ID: ${r2}`);
                
                // Connect routers
                console.log('Connecting routers...');
                simulator.connect_routers(r1, r2, 10);
                
                // Enable OSPF on both routers
                console.log('Enabling OSPF...');
                simulator.enable_ospf(r1);
                simulator.enable_ospf(r2);
                
                // Check initial state
                console.log('\n=== Initial State ===');
                for (let id of [r1, r2]) {
                    const summary = JSON.parse(simulator.get_router_summary_json(id));
                    console.log(`Router ${id}: OSPF=${summary.ospf_enabled}, LSAs=${summary.lsa_count}`);
                }
                
                // Start simulation
                console.log('\nStarting simulation...');
                simulator.start_simulation();
                
                // Run for just 5 seconds with detailed logging
                let steps = 0;
                const interval = setInterval(() => {
                    simulator.step_simulation(0.1);
                    steps++;
                    
                    // Log every second
                    if (steps % 10 === 0) {
                        const time = steps * 0.1;
                        console.log(`\n=== Time: ${time.toFixed(1)}s ===`);
                        
                        // Get recent events
                        const events = JSON.parse(simulator.get_recent_events_json(50));
                        const recentEvents = events.filter(e => e.timestamp >= time - 1.0);
                        
                        if (recentEvents.length > 0) {
                            console.log('Recent events:');
                            recentEvents.forEach(event => {
                                console.log(`  [${event.timestamp.toFixed(2)}s] ${event.description}`);
                            });
                        }
                        
                        // Check routing tables
                        for (let id of [r1, r2]) {
                            const summary = JSON.parse(simulator.get_router_summary_json(id));
                            console.log(`Router ${id}: Neighbors=${summary.neighbor_count}, LSAs=${summary.lsa_count}, Routes=${summary.routing_table ? summary.routing_table.length : 0}`);
                        }
                    }
                    
                    // Stop after 5 seconds
                    if (steps >= 50) {
                        clearInterval(interval);
                        console.log('\n=== Final Check ===');
                        
                        // Detailed final state
                        for (let id of [r1, r2]) {
                            const summary = JSON.parse(simulator.get_router_summary_json(id));
                            console.log(`\nRouter ${id} Final State:`);
                            console.log(`  OSPF: ${summary.ospf_enabled}`);
                            console.log(`  Neighbors: ${summary.neighbor_count}`);
                            console.log(`  LSAs: ${summary.lsa_count}`);
                            console.log(`  Routes: ${summary.routing_table ? summary.routing_table.length : 0}`);
                            
                            if (summary.routing_table && summary.routing_table.length > 0) {
                                console.log('  Routing Table:');
                                summary.routing_table.forEach(route => {
                                    console.log(`    ${route.destination} -> ${route.next_hop} (metric: ${route.metric})`);
                                });
                            } else {
                                console.log('  Routing Table: EMPTY!');
                            }
                        }
                        
                        // Get all events
                        console.log('\n=== All Events ===');
                        const allEvents = JSON.parse(simulator.get_recent_events_json(1000));
                        allEvents.forEach(event => {
                            console.log(`[${event.timestamp.toFixed(2)}s] ${event.description}`);
                        });
                    }
                }, 100); // Run every 100ms
            })
            .catch(error => {
                console.error('Failed to load WASM module:', error);
            });
    </script>
</head>
<body>
    <h1>OSPF Debug Test</h1>
    <p>Open the browser console (F12) to see detailed debug output.</p>
    <p>This test runs for only 5 seconds with detailed logging.</p>
</body>
</html>
