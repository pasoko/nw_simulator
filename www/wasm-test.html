<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WASM Test</title>
</head>
<body>
    <h1>WASM Loading Test</h1>
    <div id="output"></div>
    
    <script>
        const output = document.getElementById('output');
        
        function log(message, type = 'info') {
            const color = type === 'error' ? 'red' : type === 'success' ? 'green' : 'black';
            output.innerHTML += `<p style="color: ${color}">${message}</p>`;
            console.log(message);
        }
        
        // Test 1: Check WebAssembly support
        if (typeof WebAssembly === 'undefined') {
            log('WebAssembly is NOT supported!', 'error');
        } else {
            log('WebAssembly is supported', 'success');
        }
        
        // Test 2: Try to fetch WASM file directly
        async function testWasmFetch() {
            try {
                // Get list of WASM files by checking network requests
                log('Checking for WASM files...');
                
                // Try common WASM file names
                const possibleFiles = [
                    'pkg/nw_simulator_bg.wasm',
                    '1497e889520afbc86913.wasm',
                    'b57ea1b4dc8b0d72fa91.wasm'
                ];
                
                for (const file of possibleFiles) {
                    try {
                        const response = await fetch('/' + file);
                        if (response.ok) {
                            log(`Found WASM file: ${file}`, 'success');
                            const contentType = response.headers.get('content-type');
                            log(`Content-Type: ${contentType}`);
                            
                            // Check if it's actually WASM
                            const buffer = await response.arrayBuffer();
                            const bytes = new Uint8Array(buffer);
                            const magic = Array.from(bytes.slice(0, 4)).map(b => b.toString(16).padStart(2, '0')).join(' ');
                            log(`Magic bytes: ${magic}`);
                            
                            if (magic === '00 61 73 6d') {
                                log('Valid WASM file!', 'success');
                            } else {
                                log('Invalid WASM file (wrong magic bytes)', 'error');
                                // Show what we got instead
                                const text = new TextDecoder().decode(bytes.slice(0, 100));
                                log(`Got instead: ${text.substring(0, 50)}...`);
                            }
                            
                            break;
                        } else {
                            log(`${file}: ${response.status} ${response.statusText}`, 'error');
                        }
                    } catch (err) {
                        log(`Error fetching ${file}: ${err.message}`, 'error');
                    }
                }
                
            } catch (err) {
                log(`Error: ${err.message}`, 'error');
            }
        }
        
        // Test 3: Try to load the actual module
        async function testModuleLoad() {
            try {
                log('Attempting to load WASM module...');
                const module = await import('./pkg/nw_simulator.js');
                log('Module loaded successfully!', 'success');
                
                await module.default();
                log('WASM initialized!', 'success');
                
                const simulator = new module.NetworkSimulator();
                log('NetworkSimulator created!', 'success');
                
            } catch (err) {
                log(`Module load error: ${err.message}`, 'error');
                console.error(err);
            }
        }
        
        // Run tests
        testWasmFetch().then(() => testModuleLoad());
    </script>
</body>
</html>
