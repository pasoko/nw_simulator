<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Network Simulator - OSPFv2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/modern-theme.css">
    <link rel="stylesheet" href="styles/sidebar-modern.css">
    <link rel="stylesheet" href="styles/dark-mode.css">
    <link rel="stylesheet" href="styles/router-details.css">
    <link rel="stylesheet" href="styles/animations.css">
    <style>
        /* Layout overrides for existing structure */
        body {
            margin: 0;
            display: flex;
            height: 100vh;
            position: relative;
        }
        /* Sidebar width is now set in sidebar-modern.css */
        #main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        #canvas-container {
            flex: 1;
            position: relative;
            overflow: hidden;
        }
        #network-canvas {
            cursor: crosshair;
        }
        #controls {
            background-color: #e0e0e0;
            padding: 10px;
        }
        /* Additional styles for elements not covered by modern-theme.css */
        .router-interfaces {
            margin: 5px 0;
        }
        
        .routing-table th:nth-child(1),
        .routing-table td:nth-child(1) {
            width: 35%;
        }
        .routing-table th:nth-child(2),
        .routing-table td:nth-child(2) {
            width: 35%;
        }
        .routing-table th:nth-child(3),
        .routing-table td:nth-child(3) {
            width: 15%;
        }
        .routing-table th:nth-child(4),
        .routing-table td:nth-child(4) {
            width: 15%;
        }
        
        .ospf-status {
            background-color: var(--bg-secondary);
            padding: var(--spacing-sm);
            margin: var(--spacing-sm) 0;
            border-radius: var(--radius-sm);
        }
        
        .detail-section h5 {
            margin: 0 0 5px 0;
            font-size: 12px;
            color: var(--text-primary);
        }
        
        #log-container {
            height: 200px;
            padding: 10px;
            overflow-y: auto;
            position: relative;
        }
        
        #simulation-timer {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 10;
        }
        
        #router-select {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
        }
        
        #router-details {
            background-color: var(--bg-secondary);
            padding: 10px;
            border-radius: var(--radius-sm);
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
        }
        
        .interface-list {
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <div id="sidebar">
        <!-- Content will be dynamically generated by sidebar-ui.js -->
    </div>
    
    <div id="main">
        <div id="canvas-container">
            <canvas id="network-canvas"></canvas>
            <div id="simulation-timer" style="display: none;">Time: 0.0s</div>
        </div>
        <div id="log-container">
            <div id="log-content"></div>
        </div>
    </div>
    
    
    <script type="module" src="index.js"></script>
</body>
</html>
