<!DOCTYPE html>
<html>
<head>
    <title>OSPF Routing Table Test</title>
    <script type="module">
        import('./nw_simulator.wasm')
            .then(wasmModule => {
                console.log('WASM module loaded successfully');
                
                // Initialize simulator
                const simulator = new wasmModule.NetworkSimulator();
                
                // Create a simple 3-router topology
                console.log('Creating 3-router topology...');
                const r1 = simulator.add_router("Router1", 100, 100);
                const r2 = simulator.add_router("Router2", 300, 100);
                const r3 = simulator.add_router("Router3", 200, 300);
                
                // Connect routers in a triangle
                console.log('Connecting routers...');
                simulator.connect_routers(r1, r2, 10);
                simulator.connect_routers(r2, r3, 20);
                simulator.connect_routers(r3, r1, 30);
                
                // Enable OSPF on all routers
                console.log('Enabling OSPF...');
                simulator.enable_ospf(r1);
                simulator.enable_ospf(r2);
                simulator.enable_ospf(r3);
                
                // Start simulation
                console.log('Starting simulation...');
                simulator.start_simulation();
                
                // Run simulation for 120 seconds (enough for OSPF to converge)
                let simTime = 0;
                const interval = setInterval(() => {
                    simulator.step_simulation(1.0);
                    simTime += 1;
                    
                    // Check routing tables every 10 seconds
                    if (simTime % 10 === 0) {
                        console.log(`\n=== Time: ${simTime}s ===`);
                        
                        // Get router summaries
                        for (let id of [r1, r2, r3]) {
                            const summary = JSON.parse(simulator.get_router_summary_json(id));
                            console.log(`Router ${id}:`);
                            console.log(`  Neighbors: ${summary.neighbor_count}`);
                            console.log(`  LSAs: ${summary.lsa_count}`);
                            console.log(`  Routes: ${summary.routing_table ? summary.routing_table.length : 0}`);
                            
                            if (summary.routing_table) {
                                summary.routing_table.forEach(route => {
                                    console.log(`    -> ${route.destination} via ${route.next_hop} metric ${route.metric}`);
                                });
                            }
                        }
                        
                        // Get recent events
                        const events = JSON.parse(simulator.get_recent_events_json(20));
                        console.log('\nRecent events:');
                        events.forEach(event => {
                            if (event.description) {
                                console.log(`  [${event.timestamp.toFixed(2)}s] ${event.description}`);
                            }
                        });
                    }
                    
                    // Stop after 120 seconds
                    if (simTime >= 120) {
                        clearInterval(interval);
                        console.log('\nSimulation complete.');
                    }
                }, 100); // Run every 100ms = 0.1s
            })
            .catch(error => {
                console.error('Failed to load WASM module:', error);
            });
    </script>
</head>
<body>
    <h1>OSPF Routing Table Test</h1>
    <p>Open the browser console to see the test results.</p>
    <p>The test creates a 3-router triangle topology and runs OSPF for 120 seconds.</p>
</body>
</html>
