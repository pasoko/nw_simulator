apiVersion: apps/v1
kind: Deployment
metadata:
  name: ospf-network-simulator
  labels:
    app: ospf-simulator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ospf-simulator
  template:
    metadata:
      labels:
        app: ospf-simulator
    spec:
      containers:
      - name: ospf-simulator
        image: ospf-network-simulator:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health.html
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health.html
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: ospf-simulator-service
  labels:
    app: ospf-simulator
spec:
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: ospf-simulator

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ospf-simulator-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: ospf-simulator.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ospf-simulator-service
            port:
              number: 80