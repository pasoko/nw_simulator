# Codecov configuration
codecov:
  require_ci_to_pass: yes
  max_report_age: 24

coverage:
  precision: 2
  round: down
  range: "70...100"
  
  status:
    project:
      default:
        target: 80%
        threshold: 2%
        base: auto
        flags:
          - rust
          - javascript
        if_not_found: success
        if_ci_failed: error
        only_pulls: false
        
    patch:
      default:
        target: 80%
        threshold: 5%
        base: auto
        if_not_found: success
        
flags:
  rust:
    paths:
      - src/
    carryforward: true
    
  javascript:
    paths:
      - www/modules/
      - www/index.js
      - www/packet-visualizer.js
    carryforward: true

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: yes
  
ignore:
  - "**/*.test.js"
  - "**/*_test.rs"
  - "www/pkg/**"
  - "target/**"
  - "node_modules/**"