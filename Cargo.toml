[package]
name = "nw_simulator"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["pasoko"]
description = "OSPFv2 network simulator built with Rust and WebAssembly"
repository = "https://github.com/pasoko/nw_simulator"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3.77"
features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "Window",
]

[dev-dependencies]
wasm-bindgen-test = "0.3"
criterion = { version = "0.6", features = ["html_reports"] }

[[bench]]
name = "ospf_benchmark"
harness = false

[profile.release]
opt-level = 3
lto = true
