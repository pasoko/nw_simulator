[package]
name = "nw_simulator"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3.77"
features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "Window",
]

[profile.release]
opt-level = 3
lto = true
