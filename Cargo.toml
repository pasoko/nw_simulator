[package]
name = "nw_simulator"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.13.1"

[dependencies.web-sys]
version = "0.3.77"
features = [
  "console",
  "Document",
  "Element",
  "HtmlElement",
  "Window",
]

[profile.release]
opt-level = 3
lto = true
